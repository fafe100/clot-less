# Netlify build configuration.
#
# Committing this means the deploy settings live with the code rather than in a
# dashboard, so a rebuild years from now produces the same site.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned deliberately. Netlify's default Node is older than this project's
  # local toolchain, and an unpinned build is the usual reason a site that
  # builds fine on a laptop fails in CI. 22 is the current LTS and satisfies
  # Astro 5's engine requirement.
  NODE_VERSION = "22"

# Long-cache the fingerprinted build output. Every file under /_astro/ has a
# content hash in its name, so it can never go stale.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Files served straight out of public/ have no content hash, so they cannot be
# immutable — but they also almost never change, and without a Cache-Control
# they are revalidated on every single view. A week is long enough to matter and
# short enough that a replacement propagates without anyone chasing caches.
#
# Note these are separate rules rather than another Cache-Control on /*: Netlify
# applies EVERY matching rule, and two rules setting the same header name on one
# path is not a merge.
[[headers]]
  for = "/og-card.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/email-signature-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
